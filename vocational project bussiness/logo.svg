<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" fill="none">
  <defs>
    <linearGradient id="lumi-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="lumi-grad-soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="lumi-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Icon mark -->
  <g>
    <rect x="2" y="4" width="48" height="48" rx="13" fill="url(#lumi-grad)"/>
    <rect x="2" y="4" width="48" height="48" rx="13" fill="url(#lumi-grad-soft)"/>
    <!-- stylized L -->
    <path d="M16 14 L16 42 L36 42 L36 35 L24 35 L24 14 Z" fill="#FFFFFF"/>
    <!-- spark dot -->
    <circle cx="36" cy="18" r="4.2" fill="#FFFFFF" filter="url(#lumi-glow)"/>
    <circle cx="36" cy="18" r="2.1" fill="#FFFFFF"/>
  </g>
  <!-- Wordmark -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800">
    <text x="62" y="36" font-size="28" fill="#0F0F1A" letter-spacing="-0.8">Lumi</text>
  </g>
</svg>
